name: Scrape Dispensary Menus
# Workflow schedules: hourly fast (:00), every 4h zeros (:30)

on:
  schedule:
    # Fast scrape every hour at :00 (dispensaries WITH products)
    - cron: '0 * * * *'
    # Zeros scrape every 4 hours at :30 (dispensaries WITHOUT products - catch restocks)
    - cron: '30 */4 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast
          - zeros
          - full
      dispensary_id:
        description: 'Dispensary ID to scrape (leave empty for all in mode)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISPENSARY_ID: ${{ inputs.dispensary_id }}
        run: |
          # Single dispensary mode (manual only)
          if [ -n "$DISPENSARY_ID" ]; then
            echo "Scraping single dispensary: $DISPENSARY_ID"
            node scrape-one.js "$DISPENSARY_ID"
            exit 0
          fi

          # Determine mode based on trigger
          if [ -n "${{ inputs.mode }}" ]; then
            # Manual trigger - use selected mode
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 */4 * * *" ]; then
            # Zeros schedule (every 4h at :30)
            MODE="zeros"
          else
            # Hourly schedule (:00) - fast mode
            MODE="fast"
          fi

          echo "Running $MODE scrape"
          npm run scrape:$MODE
